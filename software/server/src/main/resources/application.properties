server.address=${QULAY_BIND:127.0.0.1}
server.port=${QULAY_PORT:8080}
qulay.storage=${QULAY_STORAGE:runtime/store}
qulay.token=${QULAY_TOKEN:}
qulay.dev-mode=${QULAY_DEV_MODE:false}
server.error.include-message=never
server.tomcat.max-http-form-post-size=32MB
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=32MB
