name: Mechanical and installation manual
on:
  push:
    branches: ['feature/qulay-prototype-20261002']
    paths: ['docs/manual/**', '.github/workflows/mechanical-manual.yml']
permissions:
  contents: write
concurrency:
  group: qulay-mechanical-manual
  cancel-in-progress: false
jobs:
  manual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check authoring sources
        id: sources
        run: |
          if [ -f docs/manual/build_manual.py ] && [ -f docs/manual/prepare_assets.py ] && [ -f docs/manual/manual.md ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Waiting for the remaining authoring source files.'
          fi
      - name: Verify pinned engineering inputs
        if: steps.sources.outputs.ready == 'true'
        run: |
          git diff --exit-code a72e3a0d45d8b01d22f80cbc825711bc627f5c7f -- mechanical electronics config firmware docs/REVISION_R1.md docs/METROLOGY.md docs/SOFTWARE.md
      - name: CAD and document toolchain
        if: steps.sources.outputs.ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libgl1 libegl1
          python -m pip install cadquery==2.8.0 ezdxf reportlab pymupdf pillow
      - name: Build CAD views and mechanical installation manual
        if: steps.sources.outputs.ready == 'true'
        run: |
          python docs/manual/prepare_assets.py
          python docs/manual/build_manual.py
      - uses: actions/upload-artifact@v4
        if: steps.sources.outputs.ready == 'true'
        with:
          name: qulay-mechanical-installation-manual
          path: |
            docs/manual/QL01-R1-Mechanical-Installation.pdf
            docs/manual/source-manifest.json
            docs/manual/document-check.json
          retention-days: 90
      - name: Publish manual to feature branch only
        if: steps.sources.outputs.ready == 'true'
        run: |
          test "$GITHUB_REF_NAME" = "feature/qulay-prototype-20261002"
          git config user.name 'qulay-docs'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/manual
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: publish mechanical and installation manual PDF [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
