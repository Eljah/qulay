name: RP2040 firmware compile
on:
  push:
    branches: ['feature/qulay-prototype-20261002']
    paths: ['firmware/**', '.github/workflows/firmware.yml']
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host protocol tests
        run: |
          mkdir -p generated/firmware
          cc -std=c11 -Wall -Wextra -Werror -Ifirmware/include firmware/tests/protocol_test.c -o /tmp/ql-protocol
          /tmp/ql-protocol | tee generated/firmware/protocol-test.txt
      - name: ARM compiler and fixed Pico SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
          git clone --depth 1 --branch 2.1.1 https://github.com/raspberrypi/pico-sdk.git /tmp/pico-sdk
          git -C /tmp/pico-sdk submodule update --init --depth 1 lib/tinyusb
      - name: Compile UF2 and ELF, not an execution-on-hardware claim
        env:
          PICO_SDK_PATH: /tmp/pico-sdk
        run: |
          cmake -S firmware -B firmware/build -DPICO_BOARD=pico -DPICO_NO_PICOTOOL=1 -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build -j2
          cp firmware/build/qulay_acquisition.uf2 firmware/build/qulay_acquisition.elf generated/firmware/
          sha256sum generated/firmware/* > generated/firmware/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qulay-rp2040-firmware
          retention-days: 90
          path: generated/firmware
