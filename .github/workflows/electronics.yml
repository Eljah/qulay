name: KiCad electronics build and publish
on:
  push:
    branches: ['feature/qulay-prototype-20261002']
    paths: ['electronics/*.py', '.github/workflows/electronics.yml']
permissions:
  contents: write
concurrency:
  group: qulay-electronics
  cancel-in-progress: false
jobs:
  electronics:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: KiCad 9 and offline autorouter
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad xvfb
          curl -fL --retry 3 https://github.com/freerouting/freerouting/releases/download/v1.9.0/freerouting-1.9.0.jar -o /tmp/freerouting.jar
          mkdir -p electronics/generated
          kicad-cli version > electronics/generated/kicad-version.txt
          sha256sum /tmp/freerouting.jar > electronics/generated/router-sha256.txt
      - name: Connected schematic, PCB and serialized pad assertions
        run: |
          set -o pipefail
          /usr/bin/python3 electronics/build_checked.py 2>&1 | tee electronics/generated/build.log
      - name: Route both actual boards
        run: |
          for board in encoder carrier; do
            base="electronics/generated/$board/$board"
            rm -f "$base.ses"
            timeout 180 xvfb-run -a java -jar /tmp/freerouting.jar -de "$base.dsn" -do "$base.ses" -mp 10 -mt 1 -oit 1 -dct 1 -da > "$base-router.log" 2>&1 || echo 'Router stopped; subsequent electrical checks decide success'
          done
      - name: Actual ERC, DRC, schematic-PCB netlist parity and exports
        run: |
          set -o pipefail
          /usr/bin/python3 electronics/verify.py 2>&1 | tee electronics/generated/verification.log
          find electronics/generated -name '*.kicad_prl' -delete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qulay-kicad-electronics
          retention-days: 90
          path: electronics/generated
      - name: Publish only checked generated files to the existing branch
        run: bash tools/publish_generated.sh electronics/generated electronics/build.py electronics/build_checked.py electronics/verify.py electronics/polish.py .github/workflows/electronics.yml
