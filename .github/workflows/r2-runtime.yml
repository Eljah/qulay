name: R2 runtime verification
on:
  push:
    branches: ['feature/qulay-prototype-20261002']
    paths: ['release/r2/runtime/**', 'release/r2/install_runtime.py', 'release/r2/test_q2.py', '.github/workflows/r2-runtime.yml']
permissions:
  contents: write
concurrency:
  group: qulay-r2-runtime
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integrate canonical source with context checks
        run: python3 release/r2/install_runtime.py
      - name: Build all modules and execute tests
        run: mvn -B -ntp verify
      - name: Old and new data paths
        run: |
          java -jar software/simulator/target/simulator-0.1.0.jar generated/demo
          python3 tools/e2e.py
          python3 release/r2/test_q2.py
      - name: Collect actual verification counts
        run: |
          python3 - <<'PY'
          import pathlib,json,xml.etree.ElementTree as ET,os
          root=pathlib.Path('generated/verification-r2');root.mkdir(parents=True,exist_ok=True)
          suites=[]
          for p in pathlib.Path('software').glob('*/target/surefire-reports/TEST-*.xml'):
              s=ET.parse(p).getroot();suites.append({'name':s.attrib['name'],**{k:int(s.attrib.get(k,0)) for k in ['tests','failures','errors','skipped']}})
          report={'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'suites':suites,'totals':{k:sum(s[k] for s in suites) for k in ['tests','failures','errors','skipped']},'legacy_e2e':json.loads(pathlib.Path('generated/verification/e2e.json').read_text()),'q2_e2e':json.loads((root/'q2-e2e.json').read_text()),'hardware_executed':False,'metrology_validated':False}
          (root/'summary.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qulay-r2-applications-and-tests
          retention-days: 90
          path: |
            software/*/target/*.jar
            software/*/target/surefire-reports/*
            generated/verification-r2
            generated/demo
      - name: Preserve canonical source and verification without replacing main
        run: |
          test "$GITHUB_REF_NAME" = 'feature/qulay-prototype-20261002'
          git config user.name 'qulay-r2-build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add software generated/verification-r2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(r2): integrate tested Q2 runtime and preserve verification [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
