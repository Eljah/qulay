name: Revised CAD interference review
on:
  push:
    branches: ['feature/qulay-prototype-20261002']
    paths: ['mechanical/revision_b.py', '.github/workflows/cad-review.yml']
permissions:
  contents: write
concurrency:
  group: qulay-cad-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CAD and drawing dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libgl1 libegl1
          python -m pip install cadquery==2.8.0 ezdxf reportlab
      - name: B-rep intersections, three assemblies and section drawings
        run: |
          mkdir -p mechanical/generated-r1
          set -o pipefail
          python mechanical/revision_b.py 2>&1 | tee mechanical/generated-r1/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qulay-cad-revision-b
          path: mechanical/generated-r1
          retention-days: 90
      - name: Publish to existing feature branch
        run: |
          test "$GITHUB_REF_NAME" = "feature/qulay-prototype-20261002"
          git config user.name qulay-build
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanical/generated-r1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(cad): publish revision B and explicit collision evidence [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
