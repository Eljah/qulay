name: CAD build and publish
on:
  push:
    branches: ['feature/qulay-prototype-20261002']
    paths: ['mechanical/build.py', 'config/geometry.json', '.github/workflows/cad.yml']
permissions:
  contents: write
concurrency:
  group: qulay-cad
  cancel-in-progress: false
jobs:
  cad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Geometry and drawing toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core libgl1 libegl1
          python -m pip install cadquery==2.8.0 ezdxf reportlab
      - name: Generate real B-rep models, renders and PDF
        run: python mechanical/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: qulay-cad-ql01
          retention-days: 90
          path: mechanical/generated
      - name: Publish generated engineering files to feature branch only
        run: |
          test "$GITHUB_REF_NAME" = "feature/qulay-prototype-20261002"
          git config user.name 'qulay-build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mechanical/generated
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(cad): publish STEP, DXF, CAD views, A3 album and registers [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
